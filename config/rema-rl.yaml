data:
  tokenizer: null
  chat_template: null  # override in code
  train_files: /root/tmpdir/MATH/train_lv3to5_8k.parquet
  val_files: /root/tmpdir/overall_math/test.parquet
  prompt_key: question
  reward_fn_key: data_source
  max_prompt_length: 4096
  max_response_length: 1024
  train_batch_size: 48
  val_batch_size: 64
  return_raw_input_ids: False  # This should be set to true when the tokenizer between policy and rm differs
  return_raw_chat: False
  shuffle: True
  dataloader_num_workers: 4
  sampler:
    class_path: null
    class_name: null

actor_rollout_ref:
  hybrid_engine: True
  model:
    path: Qwen/Qwen2.5-1.5B-Instruct
    external_lib: null
    override_config: { }
    enable_gradient_checkpointing: True
    use_remove_padding: True
  actor:
    strategy: fsdp  # This is for backward-compatibility
    clip_mode: turn
    ppo_mini_batch_size: 12  # per GPU
    ppo_micro_batch_size: null # will be deprecated, use ppo_micro_batch_size_per_gpu
    ppo_micro_batch_size_per_gpu: 8
    use_dynamic_bsz: True
    ppo_max_token_len_per_gpu: 16384 # n * ${data.max_prompt_length} + ${data.max_response_length}
    grad_clip: 1.0
    clip_ratio: 0.2
    clip_ratio_c: 3.0
    clip_ratio_low: null
    clip_ratio_high: null
    loss_agg_mode: trajectory
    agg_mode: trajectory
    entropy_coeff: 0.0
    entropy_coeff_by_role:
      meta_thinking: 0.001
      reasoning: 0.002
      decomposer: 0.001
      selector: 0.001
      algebra_worker: 0.002
      functional_analysis_worker: 0.002
      general_math_worker: 0.002
      worker_stage_1: 0.002
      worker_stage_2: 0.002
      worker_stage_3: 0.002
      worker_stage_4: 0.002
      worker_stage_5: 0.002
      worker_stage_6: 0.002
      finalizer: 0.002
    use_kl_loss: False # True for GRPO, False for DrGRPO
    kl_loss_coef: 0.001 # for grpo
    kl_loss_type: low_var_kl # for grpo
    log_ratio_clip_c: 3.0
    ppo_epochs: 1
    shuffle: False
    policy_loss:
      loss_mode: "vanilla"
      ppo_kl_coef: 0.1
    ulysses_sequence_parallel_size: 1 # sp size
    entropy_from_logits_with_chunking: False
    entropy_checkpointing: False
    checkpoint:
      save_contents: ['model', 'optimizer', 'extra']
      load_contents: ${actor_rollout_ref.actor.checkpoint.save_contents}
      contents: ${actor_rollout_ref.actor.checkpoint.save_contents}
    
    optim:
      lr: 5e-6
      lr_warmup_steps_ratio: 0.  # the total steps will be injected during runtime
      min_lr_ratio: null   # only useful for warmup with cosine
      warmup_style: constant  # select from constant/cosine
      total_training_steps: -1  # must be override by program
    fsdp_config:
      model_dtype: bfloat16
      param_offload: False
      optimizer_offload: False
      fsdp_size: -1
      forward_prefetch: False

  ref:
    fsdp_config:
      model_dtype: bfloat16
      param_offload: False
      fsdp_size: -1
      forward_prefetch: False
    log_prob_micro_batch_size: null # will be deprecated, use log_prob_micro_batch_size_per_gpu
    log_prob_micro_batch_size_per_gpu: 2
    log_prob_use_dynamic_bsz: ${actor_rollout_ref.actor.use_dynamic_bsz}
    log_prob_max_token_len_per_gpu: ${actor_rollout_ref.actor.ppo_max_token_len_per_gpu}
    ulysses_sequence_parallel_size: 1  # ${actor_rollout_ref.actor.ulysses_sequence_parallel_size}
    entropy_from_logits_with_chunking: False
    entropy_checkpointing: False
  rollout:
    name: vllm
    mode: sync
    temperature: 1.0
    top_k: -1 # 0 for hf rollout, -1 for vllm rollout
    top_p: 1
    prompt_length: ${data.max_prompt_length}  # not use for opensource
    response_length: ${data.max_response_length}
    # for vllm rollout
    dtype: bfloat16 # should align with FSDP
    gpu_memory_utilization: 0.8
    ignore_eos: False
    enforce_eager: False
    free_cache_engine: False
    load_format: dummy_dtensor
    tensor_model_parallel_size: 1
    max_num_batched_tokens: 8192
    max_model_len: 8192
    max_num_seqs: 2048
    stop_when_truncated: True
    log_prob_micro_batch_size: null # will be deprecated, use log_prob_micro_batch_size_per_gpu
    log_prob_micro_batch_size_per_gpu: ${actor_rollout_ref.ref.log_prob_micro_batch_size_per_gpu}
    log_prob_use_dynamic_bsz: ${actor_rollout_ref.actor.use_dynamic_bsz}
    log_prob_max_token_len_per_gpu: ${actor_rollout_ref.actor.ppo_max_token_len_per_gpu}
    disable_log_stats: True
    add_checking: False
    max_num_turns: 3
    enable_chunked_prefill: True # may get higher throughput when set to True. When activated, Please increase max_num_batched_tokens or decrease max_model_len.
    do_sample: True
    n: 24
    engine_kwargs:
      vllm:
        swap_space: null
        disable_mm_preprocessor_cache: False
    val_kwargs:
      top_k: -1
      top_p: 1.0
      temperature: 1
      n: 1
      do_sample: True
    calculate_log_probs: False

critic:
  rollout_n: ${actor_rollout_ref.rollout.n}
  strategy: ${actor_rollout_ref.actor.strategy}
  optim:
    lr: 5e-6
    lr_warmup_steps_ratio: 0.  # the total steps will be injected during runtime
    min_lr_ratio: null   # only useful for warmup with cosine
    warmup_style: constant  # select from constant/cosine
    total_training_steps: -1  # must be override by program
    weight_decay: 0.65
  model:
    path: ${actor_rollout_ref.model.path}
    tokenizer_path: ${actor_rollout_ref.model.path}
    override_config: { }
    external_lib: ${actor_rollout_ref.model.external_lib}
    enable_gradient_checkpointing: True
    use_remove_padding: True
    fsdp_config:
      model_dtype: bfloat16
      param_offload: False
      optimizer_offload: False
      wrap_policy:
        # transformer_layer_cls_to_wrap: None
        min_num_params: 0
      fsdp_size: -1
      forward_prefetch: False
  ppo_mini_batch_size: 512
  ppo_micro_batch_size: null # will be deprecated, use ppo_micro_batch_size_per_gpu
  ppo_micro_batch_size_per_gpu: ${actor_rollout_ref.actor.ppo_mini_batch_size}
  forward_micro_batch_size: ${critic.ppo_micro_batch_size}
  forward_micro_batch_size_per_gpu: ${critic.ppo_micro_batch_size_per_gpu}
  use_dynamic_bsz: True
  ppo_max_token_len_per_gpu: 24000  # (${actor_rollout_ref.actor.ppo_max_token_len_per_gpu}) * 2
  forward_max_token_len_per_gpu: ${critic.ppo_max_token_len_per_gpu}
  ulysses_sequence_parallel_size: 1 # sp size
  ppo_epochs: 1
  shuffle: ${actor_rollout_ref.actor.shuffle}
  grad_clip: 1.0
  cliprange_value: 0.5
  loss_agg_mode: ${actor_rollout_ref.actor.loss_agg_mode}
  checkpoint:
    save_contents: ['model', 'optimizer', 'extra']
    load_contents: ${critic.checkpoint.save_contents}

reward_model:
  strategy: fsdp
  enable: False
  sandbox_fusion:
    url: null
    max_concurrent: 64
    memory_limit_mb: 1024
  launch_reward_fn_async: False
  reward_manager: rema
  mask_unfinished_reward: True

# custom_reward_function:
#   path: verifier.py
#   name: verify

# curriculum_learning:
#   enable: True
#   fn_name: remove_extreme
#   fn_params:
#     lower_percentile_bound: 25
#     upper_percentile_bound: 75

algorithm:
  gamma: 1.0
  lam: 1.0
  gamma_turn_level: 1.0
  gamma_token_level: 1.0
  lam_token_level: 1.0
  lam_turn_level: 1.0
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: True  # DrGRPO
  use_kl_in_reward: False
  kl_penalty: kl  # how to estimate kl divergence
  kl_ctrl:
    type: fixed
    kl_coef: 0.0
    horizon: 10000
    target_kl: 0.1
  filter_groups:
    enable: True
    max_num_gen_batches: 8
  final_worker_curriculum:
    enable: True
    warmup_steps: 200
  switch_agent:
    enable: True
    level: step
    freq: 10
    model_paths:
      - ${actor_rollout_ref.model.path}
      - ${actor_rollout_ref.model.path}
  hierarchy:
    enable: True
    decomposer_role: decomposer
    selector_role: selector
    worker_roles: [algebra_worker, functional_analysis_worker, general_math_worker]
    num_worker_stages: 6
    start_agent: decomposer
    default_worker: general_math_worker
    pass_question_to_workers: True
    worker_specs:
      algebra_worker: algebraic manipulation, equations, identities, simplification, symbolic computation
      functional_analysis_worker: functions, inequalities, limits, continuity, transformations, higher-level reasoning
      general_math_worker: fallback mathematical reasoning and synthesis support
    train_agent_roles: [decomposer, selector, worker_stage_1, worker_stage_2, worker_stage_3, worker_stage_4, worker_stage_5, worker_stage_6]

trainer:
  debug_mode: False
  balance_batch: True
  total_epochs: 5
  total_training_steps: 4000
  profile_steps: null
  project_name: verl-emerg-reason
  experiment_name: verl_trainer  #-${data.train_batch_size}_n-${actor_rollout_ref.rollout.n}
  logger: ['console', 'wandb']
  log_val_generations: 0
  val_before_train: True
  val_only: False  # True for evaluation only
  val_generations_to_log_to_wandb: 0
  nnodes: 1
  n_gpus_per_node: 2
  save_freq: 50
  esi_redundant_time: 0
  # auto: find the last ckpt to resume. If can't find, start from scratch
  resume_mode: auto # or auto or resume_path if
  resume_from_path: null
  test_freq: 10
  critic_warmup: 0
  default_hdfs_dir: null
  remove_previous_ckpt_in_save: True
  del_local_ckpt_after_load: False
  default_local_dir: /root/tmpdir/${trainer.project_name}/${trainer.experiment_name}
  device: cuda
  npu_profile:
    options:
      save_path: ./profiler_data
      roles: ["all"]
      level: level1
      with_memory: False
      record_shapes: False
      with_npu: True
      with_cpu: True
      with_module: False
      with_stack: False
      analysis: True

ray_init:
  num_cpus: 4
