algorithm:
  gamma: 1.0
  lam: 1.0
  gamma_turn_level: 1.0
  gamma_token_level: 1.0
  lam_token_level: 1.0
  lam_turn_level: 1.0
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: True  # DrGRPO
  use_kl_in_reward: False
  kl_penalty: kl  # how to estimate kl divergence
  kl_ctrl:
    type: fixed
    kl_coef: 0.0
    horizon: 10000
    target_kl: 0.1
  filter_groups:
    enable: True
    max_num_gen_batches: 8
    # If the cap is reached, train on the largest complete PPO minibatch of
    # mixed groups instead of discarding useful rollouts or aborting the job.
    use_partial_batch_on_exhaustion: True
    # With dynamic batching, use a smaller minibatch when the cap yields fewer
    # mixed groups than actor.ppo_mini_batch_size. The trainer redistributes
    # trainable rows across DP ranks and uses synchronized zero-loss forwards
    # for any empty role microbatches.
    allow_sub_minibatch_on_exhaustion: True
    # A binary GRPO group with no outcome variation has no ranking signal. At
    # the generation cap, log such a step and skip its actor update rather than
    # aborting the complete multi-role run.
    skip_update_on_zero_trainable: True
  final_worker_curriculum:
    enable: False
    warmup_steps: 200
  switch_agent:
    enable: True
    level: step
    freq: 5
    model_paths:
      - ${actor_rollout_ref.model.path}
      - ${actor_rollout_ref.model.path}
    model_use_remove_padding:
      - ${actor_rollout_ref.model.use_remove_padding}
      - ${actor_rollout_ref.model.use_remove_padding}
  hierarchy:
    enable: True
    decomposer_role: decomposer
    selector_role: selector
    worker_roles: [general_math_worker]
    # Capacity for up to four subtask workers followed by one fixed final stage.
    num_worker_stages: 5
    max_planned_subtasks: 4
    # When enabled, S1..SN map directly to worker stages 1..N and worker N's
    # boxed LOCAL_RESULT is the system answer. No separate finalizer is run.
    terminal_worker_as_answer: False
    # Skip selector generation: planned S1..SN map positionally to stages 1..N;
    # unused worker slots stay masked and the final answer always maps to stage 5.
    routing_mode: sequential_plan
    start_agent: decomposer
    default_worker: general_math_worker
    # Non-final workers see the original problem as reference context, but the
    # final stage sees the parsed plan and worker results, but not the original
    # question. This makes its answer depend on routed information.
    worker_context_mode: full_question
    final_context_mode: plan_and_worker_results
    pass_question_to_workers: True
    # The planner chooses the smallest useful number of dependent subtasks from
    # one to four. A malformed empty plan falls back to one task.
    decomposer_max_new_tokens: 512
    # Local stages have enough room to complete their reasoning and still emit
    # the terminal LOCAL_RESULT required by downstream stages.
    worker_max_new_tokens: 1024
    final_max_new_tokens: 896
    # Three-phase distillation from a frozen serial solver. Disabled for the
    # original ReMA runs and enabled only by the Agent 1/2 curriculum launcher.
    agent12_curriculum:
      enable: False
      # When false, the decomposer still generates plans but never receives an
      # optimizer step. This supports isolated Agent 2 training.
      train_decomposer: True
      teacher_attempts_key: teacher_attempts
      teacher_attempt_key: teacher_attempt
      expand_all_teacher_attempts: True
      teacher_attempts_per_question: 16
      # Number of (question, attempt) GRPO groups retained for one update.
      optimizer_prompt_batch_size: 48
      # Keep the decomposer prompt below max_prompt_length even when Agent 0
      # produced a long serial trace.
      teacher_attempt_max_chars: 8000
      # Phase 1: freeze the decomposer and teach the shared worker/final model
      # to execute plans extracted from serial attempts. Every retained attempt
      # forms a separate prompt group.
      worker_bootstrap_steps: 200
      worker_question_bootstrap_probability: 1.0
      # Phase 2: freeze workers and linearly drop the teacher-attempt context
      # while optimizing the decomposer through downstream correctness.
      decomposer_transfer_steps: 200
      # Phase 3: alternate all roles and then remove the full question from
      # non-final workers. The final stage already receives routed notes only.
      worker_question_fade_steps: 200
      worker_question_final_probability: 0.0
      # Validate the target protocol rather than the temporary full-question
      # bootstrap context.
      worker_question_eval_probability: 0.0
    # This experiment uses one complete trajectory rather than repair rounds.
    accept_revise:
      enable: False
    # Exact fixed-prefix credit. Rollouts for one UID branch at the currently
    # trained role and independently generate the complete remaining suffix.
    scoped_c3_grpo:
      enable: True
      # The single round is indexed as turn 0.
      branch_turn: 0
      mixed_groups_only: True
      normalize_advantages: True
      normalization_epsilon: 1.0e-6
      # Isolated-message leakage gate. It uses the model assigned to the
      # decomposer as a greedy solver and never sees the original question.
      prefix_probe:
        enable: False
        solver_role: decomposer
        max_new_tokens: 256
        diagnostic_samples: 2
        # Zero disables validation probes while retaining the training gate.
        validation_max_samples: 128
        system_prompt: >-
          Infer and solve the mathematical task recoverable from the provided
          information. Do not ask for more context. Show concise reasoning and
          always end with exactly one non-empty, complete \boxed{...}. If the
          requested answer cannot be inferred, end with \boxed{UNKNOWN}.
    worker_specs:
      general_math_worker: fallback mathematical reasoning and synthesis support
    train_agent_roles: [decomposer, worker_stage_1, worker_stage_2, worker_stage_3, worker_stage_4, worker_stage_5]

trainer:
  debug_mode: False
  balance_batch: True
  total_epochs: 5
  total_training_steps: 4000
  # Optional cumulative stop for one chunked training process. Optimizer
  # scheduling still uses total_training_steps.
  session_stop_step: ${trainer.total_training_steps}
  restore_dataloader_on_resume: True
  profile_steps: null
  project_name: verl-emerg-reason
  experiment_name: verl_trainer  #-${data.train_batch_size}_n-${actor_rollout_ref.rollout.n}
  # Chunked trainer sessions reuse one W&B run when an explicit ID is set.
  wandb_run_id: null
  wandb_resume: allow
  logger: ['console', 'wandb']
  log_val_generations: 0
  val_before_train: False
  val_only: False  # True for evaluation only
  val_generations_to_log_to_wandb: 0
  nnodes: 1
  n_gpus_per_node: 2
  save_freq: 50
  esi_redundant_time: 0
  # auto: find the last ckpt to resume. If can't find, start from scratch
  resume_mode: auto # or auto or resume_path if
  resume_from_path: null
  test_freq: 50
  critic_warmup: 0
  default_hdfs_dir: null
  remove_previous_ckpt_in_save: True
  del_local_ckpt_after_load: False
  default_local_dir: /root/tmpdir/${trainer.project_name}/${trainer.experiment_name}
  device: cuda
  npu_profile:
    options:
      save_path: ./profiler_data
      roles: ["all"]
      level: level1
      with_memory: False
      record_shapes: False
      with_npu: True
      with_cpu: True
      with_module: False
      with_stack: False
      analysis: True

ray_init:
  num_cpus: 4
