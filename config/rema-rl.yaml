algorithm:
  gamma: 1.0
  lam: 1.0
  gamma_turn_level: 1.0
  gamma_token_level: 1.0
  lam_token_level: 1.0
  lam_turn_level: 1.0
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: True  # DrGRPO
  use_kl_in_reward: False
  kl_penalty: kl  # how to estimate kl divergence
  kl_ctrl:
    type: fixed
    kl_coef: 0.0
    horizon: 10000
    target_kl: 0.1
  filter_groups:
    enable: True
    max_num_gen_batches: 8
  final_worker_curriculum:
    enable: False
    warmup_steps: 200
  switch_agent:
    enable: True
    level: step
    freq: 10
    model_paths:
      - ${actor_rollout_ref.model.path}
      - ${actor_rollout_ref.model.path}
  hierarchy:
    enable: True
    decomposer_role: decomposer
    selector_role: selector
    worker_roles: [algebra_worker, functional_analysis_worker, general_math_worker]
    num_worker_stages: 3
    # Two non-final stages plus one final synthesis stage.
    max_planned_subtasks: 2
    start_agent: decomposer
    default_worker: general_math_worker
    # Non-final workers see the original problem as reference context, but the
    # final stage sees only worker results. This preserves solvability while the
    # reward encourages useful, local, non-duplicated worker contributions.
    worker_context_mode: full_question
    final_context_mode: worker_results_only
    pass_question_to_workers: True
    # Meta roles need enough space for a useful plan/assignment, but not enough
    # to enter repetitive S1..S49-style loops that pollute later contexts.
    decomposer_max_new_tokens: 384
    selector_max_new_tokens: 128
    # Correct final answers that do not use worker LOCAL_RESULTs keep this
    # fraction of raw_score; using worker results restores the full raw_score.
    final_raw_score_usage_floor: 0.5
    # Cross-prefix credit from existing rollout groups. The implementation
    # transports the full suffix from the credited role through the final stage
    # and scores every reused action with teacher forcing; it performs no decoding.
    cpcr:
      enable: True
      # "diagnostic" only logs; "prd_target" supervises the online PRD router.
      mode: prd_target
      estimator: full_suffix
      outcome_mode: candidate_factual
      roles: current
      prd_loss_weight: 1.0
      prd_huber_delta: 1.0
      # The legacy feature-distance counterfactual loss is disabled when CPCR
      # supervises PRD unless this ablation flag is enabled.
      combine_with_implicit_cf: False
      # Cost controls. Set a limit to 0 for all groups/candidates.
      # Score every N visits of each trained role, not every N global steps;
      # this avoids aliasing with round-robin role switching.
      score_interval: 5
      mixed_groups_only: True
      max_groups_per_step: 2
      max_candidates_per_group: 4
      min_effective_sample_size: 2.0
      # A low-ESS group falls back to uniform LOO over the available support
      # for diagnostics, but that fallback is not a PRD target by default.
      use_fallback_targets: False
      log_weight_clip: 20.0
      fallback: group_loo
    reward_composer:
      enable: False
      checkpoint_path: null
      # Blend learned PRD rewards with the current manual role rewards:
      # role_reward = (1 - alpha) * manual_reward + alpha * prd_reward.
      blend_alpha: 0.0
      # Keep False for learned PRD experiments; True is only useful for
      # debugging imitation because it exposes manual role rewards as inputs.
      use_manual_role_features: False
      # Optional offline-training export. When set, reward manager appends one
      # JSONL record per scored sample with reward_sources and manual role_scores.
      export_jsonl_path: null
      export_jsonl_max_records: null
      # Optional graph prior for learned PRD routing. "soft" biases credit to
      # flow along decomposer -> selector -> workers -> final while still
      # allowing non-obvious cross-role signals. "hard" masks reverse links.
      graph_prior_mode: soft
      graph_prior_soft_distance_penalty: 1.0
      graph_prior_reverse_distance_penalty: 3.0
      online:
        enable: True
        # "source" keeps the original source-to-role composer.
        # "role" uses the experimental role-to-role credit router.
        model_type: role
        # CPCR is the sole teacher. Reliable labels are replayed to amortize
        # expensive full-suffix scoring; global correctness ranking is diagnostic.
        training_objective: cpcr_replay
        init_checkpoint_path: null
        lr: 3.0e-4
        weight_decay: 0.0
        hidden_dim: 128
        source_embed_dim: 32
        global_context_dim: null
        # Null chooses a safe default: softmax for role router, sigmoid for source composer.
        routing_activation: null
        routing_floor: 0.05
        # A binary global reward gives CPCR advantages in [-1, 1].
        score_activation: tanh
        # Legacy activity-only ranking. Keep disabled when matched implicit
        # counterfactual supervision is active.
        role_rank_loss_weight: 0.0
        role_activity_margin: 0.05
        role_rank_temperature: 1.0
        # Legacy feature-distance counterfactual objective, retained only for
        # ablations. The cpcr_replay objective does not execute this branch.
        implicit_cf_loss_weight: 0.0
        implicit_cf_role_distance_margin: 0.05
        implicit_cf_huber_delta: 1.0
        warmup_steps: 150
        blend_alpha: 0.05
        blend_alpha_max: 0.05
        blend_ramp_steps: 200
        min_group_size: 2
        mixed_groups_only: True
        # Update the lagged reward network after every PRD optimizer step.
        sync_interval: 1
        ema_beta: 0.9
        cpcr_replay:
          capacity: 8192
          max_age_steps: 500
          batch_size: 256
          min_train_size: 64
          min_size_for_blend: 64
          # Replay rows from one probe are correlated. Train and blend only
          # after enough independently selected problem-role probes exist.
          min_unique_train_probe_groups_for_training: 20
          min_unique_train_probe_groups_for_blend: 50
          min_train_records_per_role_for_blend: 20
          min_train_probe_groups_per_role_for_blend: 2
          min_validation_records_per_role_for_blend: 8
          min_validation_probe_groups_per_role_for_blend: 1
          validation_fraction: 0.1
          validation_min_size: 32
          validation_batch_size: 512
          validation_quality_ema_beta: 0.9
          min_validation_correlation_for_blend: 0.10
          min_validation_sign_accuracy_for_blend: 0.55
          balance_roles: True
        grad_clip: 1.0
        use_manual_role_features: False
        graph_prior_mode: soft
        graph_prior_soft_distance_penalty: 1.0
        graph_prior_reverse_distance_penalty: 3.0
    worker_specs:
      algebra_worker: algebraic manipulation, equations, identities, simplification, symbolic computation
      functional_analysis_worker: functions, inequalities, limits, continuity, transformations, higher-level reasoning
      general_math_worker: fallback mathematical reasoning and synthesis support
    train_agent_roles: [decomposer, selector, worker_stage_1, worker_stage_2, worker_stage_3]

trainer:
  debug_mode: False
  balance_batch: True
  total_epochs: 5
  total_training_steps: 4000
  profile_steps: null
  project_name: verl-emerg-reason
  experiment_name: verl_trainer  #-${data.train_batch_size}_n-${actor_rollout_ref.rollout.n}
  logger: ['console', 'wandb']
  log_val_generations: 0
  val_before_train: False
  val_only: False  # True for evaluation only
  val_generations_to_log_to_wandb: 0
  nnodes: 1
  n_gpus_per_node: 2
  save_freq: 50
  esi_redundant_time: 0
  # auto: find the last ckpt to resume. If can't find, start from scratch
  resume_mode: auto # or auto or resume_path if
  resume_from_path: null
  test_freq: 50
  critic_warmup: 0
  default_hdfs_dir: null
  remove_previous_ckpt_in_save: True
  del_local_ckpt_after_load: False
  default_local_dir: /root/tmpdir/${trainer.project_name}/${trainer.experiment_name}
  device: cuda
  npu_profile:
    options:
      save_path: ./profiler_data
      roles: ["all"]
      level: level1
      with_memory: False
      record_shapes: False
      with_npu: True
      with_cpu: True
      with_module: False
      with_stack: False
      analysis: True

ray_init:
  num_cpus: 4
