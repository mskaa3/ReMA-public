data:
  tokenizer: null
  chat_template: null  # override in code
  train_files: /root/tmpdir/MATH/train_lv3to5_8k.parquet
  val_files: /root/tmpdir/overall_math/test.parquet
  prompt_key: question
  reward_fn_key: data_source
  max_prompt_length: 6144
  max_response_length: 1024
  train_batch_size: 48
  val_batch_size: 64
  return_raw_input_ids: False  # This should be set to true when the tokenizer between policy and rm differs
  return_raw_chat: False
  shuffle: True
  seed: 1
  dataloader_num_workers: 4
  sampler:
    class_path: null
    class_name: null

actor_rollout_ref:
  hybrid_engine: True
  model:
    path: Qwen/Qwen2.5-1.5B-Instruct
    external_lib: null
    override_config: { }
    enable_gradient_checkpointing: True
    use_remove_padding: True
  actor:
    strategy: fsdp  # This is for backward-compatibility
    clip_mode: turn
    ppo_mini_batch_size: 12  # per GPU
    ppo_micro_batch_size: null # will be deprecated, use ppo_micro_batch_size_per_gpu
    ppo_micro_batch_size_per_gpu: 16
    use_dynamic_bsz: True
    ppo_max_token_len_per_gpu: 16384 # n * ${data.max_prompt_length} + ${data.max_response_length}
    grad_clip: 1.0
    clip_ratio: 0.2
    clip_ratio_c: 3.0
    clip_ratio_low: null
    clip_ratio_high: null
    loss_agg_mode: trajectory
    agg_mode: trajectory
    entropy_coeff: 0.0
    entropy_coeff_by_role:
      meta_thinking: 0.001
      reasoning: 0.002
      decomposer: 0.001
      selector: 0.001
      algebra_worker: 0.002
      functional_analysis_worker: 0.002
      general_math_worker: 0.002
      worker_stage_1: 0.002
      worker_stage_2: 0.002
      worker_stage_3: 0.002
      worker_stage_4: 0.002
      worker_stage_5: 0.002
      finalizer: 0.002
    use_kl_loss: False # True for GRPO, False for DrGRPO
    kl_loss_coef: 0.001 # for grpo
    kl_loss_type: low_var_kl # for grpo
    log_ratio_clip_c: 3.0
    ppo_epochs: 1
    shuffle: False
    policy_loss:
      loss_mode: "vanilla"
      ppo_kl_coef: 0.1
    ulysses_sequence_parallel_size: 1 # sp size
    entropy_from_logits_with_chunking: False
    entropy_checkpointing: False
    checkpoint:
      save_contents: ['model', 'optimizer', 'extra']
      load_contents: ${actor_rollout_ref.actor.checkpoint.save_contents}
      contents: ${actor_rollout_ref.actor.checkpoint.save_contents}
    
    optim:
      lr: 5e-6
      lr_warmup_steps_ratio: 0.  # the total steps will be injected during runtime
      min_lr_ratio: null   # only useful for warmup with cosine
      warmup_style: constant  # select from constant/cosine
      total_training_steps: -1  # must be override by program
    fsdp_config:
      model_dtype: bfloat16
      param_offload: False
      optimizer_offload: False
      fsdp_size: -1
      forward_prefetch: False

  ref:
    fsdp_config:
      model_dtype: bfloat16
      param_offload: False
      fsdp_size: -1
      forward_prefetch: False
    log_prob_micro_batch_size: null # will be deprecated, use log_prob_micro_batch_size_per_gpu
    log_prob_micro_batch_size_per_gpu: 4
    log_prob_use_dynamic_bsz: ${actor_rollout_ref.actor.use_dynamic_bsz}
    log_prob_max_token_len_per_gpu: ${actor_rollout_ref.actor.ppo_max_token_len_per_gpu}
    ulysses_sequence_parallel_size: 1  # ${actor_rollout_ref.actor.ulysses_sequence_parallel_size}
    entropy_from_logits_with_chunking: False
    entropy_checkpointing: False
  rollout:
    name: vllm
    mode: sync
    seed: 1
    temperature: 1.0
    top_k: -1 # 0 for hf rollout, -1 for vllm rollout
    top_p: 1
    prompt_length: ${data.max_prompt_length}  # not use for opensource
    response_length: ${data.max_response_length}
    # for vllm rollout
    dtype: bfloat16 # should align with FSDP
    gpu_memory_utilization: 0.8
    ignore_eos: False
    enforce_eager: False
    free_cache_engine: False
    load_format: dummy_dtensor
    tensor_model_parallel_size: 1
    max_num_batched_tokens: 16384
    max_model_len: 8192
    max_num_seqs: 2048
    stop_when_truncated: True
    log_prob_micro_batch_size: null # will be deprecated, use log_prob_micro_batch_size_per_gpu
    log_prob_micro_batch_size_per_gpu: ${actor_rollout_ref.ref.log_prob_micro_batch_size_per_gpu}
    log_prob_use_dynamic_bsz: ${actor_rollout_ref.actor.use_dynamic_bsz}
    log_prob_max_token_len_per_gpu: ${actor_rollout_ref.actor.ppo_max_token_len_per_gpu}
    disable_log_stats: True
    add_checking: False
    max_num_turns: 1
    enable_chunked_prefill: True # may get higher throughput when set to True. When activated, Please increase max_num_batched_tokens or decrease max_model_len.
    do_sample: True
    n: 16
    engine_kwargs:
      vllm:
        swap_space: null
        disable_mm_preprocessor_cache: False
    val_kwargs:
      top_k: -1
      top_p: 1.0
      # Greedy validation isolates policy changes from sampling noise.
      temperature: 0
      n: 1
      do_sample: False
    calculate_log_probs: False

critic:
  rollout_n: ${actor_rollout_ref.rollout.n}
  strategy: ${actor_rollout_ref.actor.strategy}
  optim:
    lr: 5e-6
    lr_warmup_steps_ratio: 0.  # the total steps will be injected during runtime
    min_lr_ratio: null   # only useful for warmup with cosine
    warmup_style: constant  # select from constant/cosine
    total_training_steps: -1  # must be override by program
    weight_decay: 0.65
  model:
    path: ${actor_rollout_ref.model.path}
    tokenizer_path: ${actor_rollout_ref.model.path}
    override_config: { }
    external_lib: ${actor_rollout_ref.model.external_lib}
    enable_gradient_checkpointing: True
    use_remove_padding: True
    fsdp_config:
      model_dtype: bfloat16
      param_offload: False
      optimizer_offload: False
      wrap_policy:
        # transformer_layer_cls_to_wrap: None
        min_num_params: 0
      fsdp_size: -1
      forward_prefetch: False
  ppo_mini_batch_size: 512
  ppo_micro_batch_size: null # will be deprecated, use ppo_micro_batch_size_per_gpu
  ppo_micro_batch_size_per_gpu: ${actor_rollout_ref.actor.ppo_mini_batch_size}
  forward_micro_batch_size: ${critic.ppo_micro_batch_size}
  forward_micro_batch_size_per_gpu: ${critic.ppo_micro_batch_size_per_gpu}
  use_dynamic_bsz: True
  ppo_max_token_len_per_gpu: 24000  # (${actor_rollout_ref.actor.ppo_max_token_len_per_gpu}) * 2
  forward_max_token_len_per_gpu: ${critic.ppo_max_token_len_per_gpu}
  ulysses_sequence_parallel_size: 1 # sp size
  ppo_epochs: 1
  shuffle: ${actor_rollout_ref.actor.shuffle}
  grad_clip: 1.0
  cliprange_value: 0.5
  loss_agg_mode: ${actor_rollout_ref.actor.loss_agg_mode}
  checkpoint:
    save_contents: ['model', 'optimizer', 'extra']
    load_contents: ${critic.checkpoint.save_contents}

reward_model:
  strategy: fsdp
  enable: False
  sandbox_fusion:
    url: null
    max_concurrent: 64
    memory_limit_mb: 1024
  launch_reward_fn_async: False
  reward_manager: rema
  mask_unfinished_reward: True

